[package]
name = "sc-nixgen"
version = "0.1.0"
edition = "2021"
description = "Generate optimized NixOS configs from SmartCool tuning data"

[[bin]]
name = "sc-nixgen"
path = "src/main.rs"

[dependencies]
sc-core = { path = "../sc-core" }
sc-detect = { path = "../sc-detect" }
sc-hwmon = { path = "../sc-hwmon" }
ronix = "0.1"
clap = { version = "4", features = ["derive"] }
ron = "0.9"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
serde_yaml = "0.9"
