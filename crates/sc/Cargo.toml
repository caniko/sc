[package]
name = "smartcool"
version = "0.1.0"
edition = "2021"
description = "Intelligent fan control daemon with derivative tracking and cooling analytics"

[[bin]]
name = "sc"
path = "src/main.rs"

[dependencies]
sc-core = { path = "../sc-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sd-notify = "0.4"
signal-hook = "0.3"
anyhow = "1"
