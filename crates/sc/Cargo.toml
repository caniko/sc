[package]
name = "smartcool"
version.workspace = true
edition.workspace = true
description = "Intelligent fan control daemon with derivative tracking and thermal integral tracking"
publish = false

[[bin]]
name = "sc"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
libc = "0.2"
sc-core.workspace = true
nvml-wrapper = "0.13"
sc-hwmon = { workspace = true, features = ["nvidia"] }
sd-notify.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-journald = "0.3"
tracing-subscriber.workspace = true
zbus.workspace = true
