# Atlas fan topology
# gpu0_fan removed — firmware-controlled (amdgpu iGPU, rejects all PWM writes)
# fan4-7 removed — 0 RPM phantom headers

fans:
  - name: fan1
    positions:
      - location: front
        direction: intake
        count: 2
      - location: top
        direction: intake

  - name: fan2
    positions:
      - location: cpu_cooler
        direction: exhaust

  - name: fan3
    positions:
      - location: top
        direction: exhaust
    group: case
